<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL TOOL</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; transition: background-color 0.2s; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 1200px; 
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { background: var(--border-color); }
        .btn.primary { background: var(--primary-color); color: white; border: none; }
        .btn.primary:hover { background: var(--primary-hover); }

        .grid { 
            display: flex;
            flex-direction: column;
            gap: 24px; 
        }

        .field-group { display: flex; flex-direction: column; gap: 10px; }

        .label-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 260px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        textarea:focus { 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); 
        }

        /* 为结果框添加一个轻微的背景区分，提示它是可编辑的 */
        #outputText {
            background: rgba(79, 70, 229, 0.02);
        }

        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 8px; display: none; }

        .examples { 
            margin-top: 25px; 
            padding-top: 20px; 
            border-top: 1px solid var(--border-color); 
            font-size: 0.9rem; 
        }
        .example-link { color: var(--primary-color); text-decoration: none; margin-right: 20px; cursor: pointer; font-weight: 500; }
        .example-link:hover { text-decoration: underline; }

        .shortcuts { margin-top: 30px; font-size: 0.8rem; color: var(--text-muted); text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>URL 编码</h1>
        <button class="btn" id="themeToggle">🌓 切换主题</button>
    </header>

    <div class="card">
        <div class="controls">
            <button class="btn primary" id="modeBtn" onclick="toggleMode()">模式: 编码 (Encode)</button>
            <button class="btn" onclick="clearAll()">✨ 清空全部</button>
            <button class="btn" id="copyBtn" onclick="copyOutput()">📋 复制结果</button>
        </div>

        <div class="grid">
            <div class="field-group">
                <div class="label-bar">
                    <span>输入内容 (Source)：</span>
                    <span id="inputCharCount">字符数: 0</span>
                </div>
                <textarea id="inputText" placeholder="在此粘贴 URL..." spellcheck="false"></textarea>
            </div>

            <div class="field-group">
                <div class="label-bar">
                    <span>处理结果 (Result - 可自由编辑)：</span>
                    <span id="outputCharCount">字符数: 0</span>
                </div>
                <textarea id="outputText" placeholder="结果将实时生成，生成后您可在此手动修改..." spellcheck="false"></textarea>
                <div id="errorMessage" class="error-msg">❌ 格式错误：解析失败</div>
            </div>
        </div>

        <div class="examples">
            <span style="color: var(--text-muted)">示例：</span>
            <span class="example-link" onclick="loadExample('https://google.com/search?q=测试')">完整 URL</span>
            <span class="example-link" onclick="loadExample('测试路径/文件.html')">中文路径</span>
        </div>
    </div>

    <div class="shortcuts">
        提示：您可以直接在下框修改生成的 URL | Ctrl+Enter 复制 | Alt+S 切换编解码
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const modeBtn = document.getElementById('modeBtn');
    const inputCount = document.getElementById('inputCharCount');
    const outputCount = document.getElementById('outputCharCount');
    const errorMsg = document.getElementById('errorMessage');

    let currentMode = 'encode';

    function toggleMode() {
        currentMode = currentMode === 'encode' ? 'decode' : 'encode';
        modeBtn.innerText = `模式: ${currentMode === 'encode' ? '编码 (Encode)' : '解码 (Decode)'}`;
        process();
    }

    function process() {
        const input = inputText.value;
        inputCount.innerText = `字符数: ${input.length}`;
        errorMsg.style.display = 'none';

        if (!input) {
            outputText.value = '';
            updateOutputCount();
            return;
        }

        try {
            const lines = input.split('\n');
            const result = lines.map(line => {
                if (currentMode === 'encode') {
                    return encodeURI(line);
                } else {
                    return decodeURIComponent(line.replace(/\+/g, ' '));
                }
            }).join('\n');

            outputText.value = result;
            updateOutputCount();
        } catch (e) {
            errorMsg.style.display = 'block';
        }
    }

    // 更新结果框字数统计的独立函数
    function updateOutputCount() {
        outputCount.innerText = `字符数: ${outputText.value.length}`;
    }

    function clearAll() {
        inputText.value = '';
        outputText.value = '';
        process();
        inputText.focus();
    }

    async function copyOutput() {
        if (!outputText.value) return;
        try {
            await navigator.clipboard.writeText(outputText.value);
            const btn = document.getElementById('copyBtn');
            const oldText = btn.innerText;
            btn.innerText = '✅ 已复制';
            setTimeout(() => btn.innerText = oldText, 1200);
        } catch (err) { alert('复制失败'); }
    }

    function loadExample(val) {
        inputText.value = val;
        process();
    }

    // 事件监听
    inputText.addEventListener('input', process);
    
    // 关键：当用户手动编辑结果框时，仅更新字数统计，不触发转换逻辑
    outputText.addEventListener('input', updateOutputCount);

    document.getElementById('themeToggle').addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    });

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') copyOutput();
        if (e.altKey && e.key.toLowerCase() === 's') toggleMode();
        if (e.altKey && e.key.toLowerCase() === 'c') clearAll();
    });

    window.onload = () => inputText.focus();
</script>

</body>
</html>
