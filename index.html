<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 编码/解码工具 Pro</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; transition: background-color 0.2s; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 850px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { background: var(--border-color); }
        .btn.primary { background: var(--primary-color); color: white; border: none; }
        .btn.primary:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

        .field-group { display: flex; flex-direction: column; gap: 8px; }

        .label-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            resize: vertical;
            outline: none;
        }

        textarea:focus { border-color: var(--primary-color); }

        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 4px; display: none; }

        .examples { margin-top: 20px; font-size: 0.875rem; border-top: 1px solid var(--border-color); padding-top: 15px;}
        .example-link { color: var(--primary-color); text-decoration: none; margin-right: 15px; cursor: pointer; }

        .shortcuts { margin-top: 24px; font-size: 0.75rem; color: var(--text-muted); text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>URL 转换器</h1>
        <button class="btn" id="themeToggle">🌓 主题切换</button>
    </header>

    <div class="card">
        <div class="controls">
            <button class="btn primary" id="modeBtn" onclick="toggleMode()">模式: 编码 (Encode)</button>
            <button class="btn" id="scopeBtn" onclick="toggleScope()" title="URI 模式不会对 : / ? # & = 等符号编码">范围: 全字符编码</button> 
            <button class="btn" onclick="clearAll()">清空</button>
            <button class="btn" id="copyBtn" onclick="copyOutput()">复制结果</button>
        </div>

        <div class="grid">
            <div class="field-group">
                <div class="label-bar">
                    <span id="inputLabel">输入：</span>
                    <span id="inputCharCount">字符: 0</span>
                </div>
                <textarea id="inputText" placeholder="输入内容..." spellcheck="false"></textarea>
            </div>

            <div class="field-group">
                <div class="label-bar">
                    <span>处理结果：</span>
                    <span id="outputCharCount">字符: 0</span>
                </div>
                <textarea id="outputText" readonly placeholder="实时结果..." spellcheck="false"></textarea>
                <div id="errorMessage" class="error-msg">❌ 格式错误：无法解析 URL 编码</div>
            </div>
        </div>

        <div class="examples">
            <span style="color: var(--text-muted)">快速测试：</span>
            <span class="example-link" onclick="loadExample('https://google.com/search?q=测试')">完整 URL</span>
            <span class="example-link" onclick="loadExample('a=1&b=测试')">参数字符串</span>
        </div>
    </div>

    <div class="shortcuts">
        快捷键：Ctrl+Enter 复制 | Alt+S 切换模式 | Alt+D 切换范围 | Alt+C 清空
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const modeBtn = document.getElementById('modeBtn');
    const scopeBtn = document.getElementById('scopeBtn');
    const inputCount = document.getElementById('inputCharCount');
    const outputCount = document.getElementById('outputCharCount');
    const errorMsg = document.getElementById('errorMessage');

    let currentMode = 'encode'; // 'encode' | 'decode'
    let encodeScope = 'component'; // 'component' (全编码) | 'uri' (不编码特殊符号)

    // 模式切换
    function toggleMode() {
        currentMode = currentMode === 'encode' ? 'decode' : 'encode';
        modeBtn.innerText = `模式: ${currentMode === 'encode' ? '编码 (Encode)' : '解码 (Decode)'}`;
        
        // 解码模式下禁用范围选择按钮
        scopeBtn.disabled = (currentMode === 'decode');
        process();
    }

    // 核心逻辑：切换编码范围
    function toggleScope() {
        if (currentMode === 'decode') return;
        encodeScope = encodeScope === 'component' ? 'uri' : 'component';
        scopeBtn.innerText = `范围: ${encodeScope === 'component' ? '全字符编码' : '保留特殊符号'}`;
        process();
    }

    // 处理函数
    function process() {
        const input = inputText.value;
        inputCount.innerText = `字符: ${input.length}`;
        errorMsg.style.display = 'none';

        if (!input) {
            outputText.value = '';
            outputCount.innerText = '字符: 0';
            return;
        }

        try {
            const lines = input.split('\n');
            const result = lines.map(line => {
                if (currentMode === 'encode') {
                    // 使用 encodeURI 不会对 : / ? @ & = 等符号编码
                    // 使用 encodeURIComponent 则会全部编码
                    return encodeScope === 'component' 
                        ? encodeURIComponent(line) 
                        : encodeURI(line);
                } else {
                    return decodeURIComponent(line.replace(/\+/g, ' '));
                }
            }).join('\n');

            outputText.value = result;
            outputCount.innerText = `字符: ${result.length}`;
        } catch (e) {
            errorMsg.style.display = 'block';
            outputText.value = '解析错误，请检查输入格式。';
        }
    }

    // 功能辅助
    function clearAll() {
        inputText.value = '';
        process();
        inputText.focus();
    }

    async function copyOutput() {
        if (!outputText.value) return;
        try {
            await navigator.clipboard.writeText(outputText.value);
            const btn = document.getElementById('copyBtn');
            const oldText = btn.innerText;
            btn.innerText = '✅ 已复制';
            setTimeout(() => btn.innerText = oldText, 1500);
        } catch (err) { alert('复制失败'); }
    }

    function loadExample(val) {
        inputText.value = val;
        process();
    }

    // 事件监听
    inputText.addEventListener('input', process);
    
    document.getElementById('themeToggle').addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    });

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') copyOutput();
        if (e.altKey && e.key.toLowerCase() === 's') toggleMode();
        if (e.altKey && e.key.toLowerCase() === 'd') toggleScope();
        if (e.altKey && e.key.toLowerCase() === 'c') clearAll();
    });

    window.onload = () => inputText.focus();
</script>

</body>
</html>
